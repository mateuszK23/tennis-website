name: Deploy to GitHub Pages

on:
  push:
    branches:
      - develop
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Fetch CSV
        env:
          CSV_URL: ${{ secrets.CSV_URL }}
        run: |
          echo "Fetching CSV..."
          mkdir -p data
          curl -L "$CSV_URL" -o src/data/matches-2025.csv

      - name: Build project
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build_and_deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
